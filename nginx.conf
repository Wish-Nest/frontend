server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Config runtime régénérée à chaque démarrage du conteneur :
  # jamais de cache, sinon un déploiement conserverait l'ancienne config.
  location = /config.js {
    add_header Cache-Control "no-store";
    try_files /config.js =404;
  }

  # Les requêtes /api ne doivent jamais être satisfaites par le fallback SPA :
  # un index.html renvoyé en 200 corrompt l'état React du client.
  # Le reverse proxy doit router /api vers le backend ; sinon on veut un 404 explicite.
  location = /api {
    return 404;
  }
  location /api/ {
    return 404;
  }

  location / {
    # Si le fichier existe, on le sert
    try_files $uri /index.html;
  }
}